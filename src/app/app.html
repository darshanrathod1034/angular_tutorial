@if(loadingService.isLoading()){ <div
    style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000000b0;z-index:9999;display:flex;align-items:center;justify-content:center;color:white;font-size:24px;backdrop-filter:blur(2px);">
    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;">
        <div
            style="width:50px;height:50px;border:4px solid #f3f3f3;border-top:4px solid #3498db;border-radius:50%;animation:spin 2s linear infinite;">
        </div>
        Loading... (HTTP request in progress)
    </div>
</div>
}
<router-outlet></router-outlet>
